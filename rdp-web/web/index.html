<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native RDP Client</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #1a1a1a; color: #fff; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; }
        input { padding: 0.5rem; border: none; border-radius: 4px; width: 250px; }
        button { padding: 0.5rem 1rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #status { margin-top: 1rem; font-weight: bold; }
    </style>
</head>
<body>
    <h1>RDP Client - Milestone 1</h1>
    <div>
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" value="192.168.1.243">
        </div>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" value="qaadmin">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" value="Test@123">
        </div>
        <button id="connectBtn">Connect</button>
    </div>
    <div id="status"></div>

    <script src="app.js"></script>
</body>
</html>
