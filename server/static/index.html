<!DOCTYPE html>
<html>
<head>
    <title>Guac-RDP Gateway</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2f3437;
            color: #f5f7f8;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #display {
            width: 100vw;
            height: 100vh;
        }

        #status {
            position: fixed;
            left: 16px;
            bottom: 16px;
            max-width: min(520px, calc(100vw - 32px));
            padding: 8px 10px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            font-size: 13px;
            line-height: 1.35;
            pointer-events: none;
            opacity: 0;
            transition: opacity 160ms ease;
        }

        #status.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="display"></div>
    <div id="status"></div>

    <script type="module">
        import Guacamole from "/node_modules/guacamole-common-js/dist/esm/guacamole-common.js";

        // Get display div
        var display = document.getElementById("display");
        var status = document.getElementById("status");

        function setStatus(message, persist) {
            status.textContent = message;
            status.classList.add("visible");

            if (!persist) {
                window.clearTimeout(setStatus.timeout);
                setStatus.timeout = window.setTimeout(function() {
                    status.classList.remove("visible");
                }, 1800);
            }
        }

        // Instantiate client using the WebSocket tunnel.
        var tunnel = new Guacamole.WebSocketTunnel("/websocket-tunnel");
        var guac = new Guacamole.Client(tunnel);

        // Add client to display div
        display.appendChild(guac.getDisplay().getElement());

        // Error handler
        guac.onerror = function(error) {
            console.error("Guacamole error:", error);
            setStatus("Connection error: " + (error.message || error.code), true);
        };

        guac.onstatechange = function(state) {
            if (state === Guacamole.Client.State.WAITING)
                setStatus("Connected. Waiting for the first frame...", true);
            else if (state === Guacamole.Client.State.CONNECTED)
                setStatus("Rendering remote desktop");
            else if (state === Guacamole.Client.State.DISCONNECTED)
                setStatus("Disconnected", true);
        };

        // Connect
        setStatus("Opening remote desktop...", true);
        guac.connect();

        // Disconnect on close
        window.onunload = function() {
            guac.disconnect();
        };

        // Mouse
        var mouse = new Guacamole.Mouse(guac.getDisplay().getElement());
        mouse.onmousedown = mouse.onmouseup = mouse.onmousemove = function(mouseState) {
            guac.sendMouseState(mouseState);
        };

        // Keyboard
        var keyboard = new Guacamole.Keyboard(document);
        keyboard.onkeydown = function (keysym) {
            guac.sendKeyEvent(1, keysym);
        };
        keyboard.onkeyup = function (keysym) {
            guac.sendKeyEvent(0, keysym);
        };
    </script>
</body>
</html>
